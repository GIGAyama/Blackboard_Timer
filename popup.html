<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 書体は拡張機能に同梱して配る（生成物。node tools/fonts/build-fonts.mjs で作り直す）。
       ここに Google Fonts への link を戻さないこと。学校のフィルタが塞ぐと
       書体が当たらず、拡張機能なのに外へ出ていることにもなる。 -->
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>どこでも<ruby>時間<rt>じかん</rt></ruby>タイマー</h2>
    
    <div class="card">
      <div class="form-group">
        <label><ruby>種類<rt>しゅるい</rt></ruby></label>
        <select id="timer-type">
          <option value="countdown">カウントダウン</option>
          <option value="countup">カウントアップ</option>
        </select>
      </div>
      
      <div class="form-group time-inputs">
        <div class="input-wrapper">
          <input type="number" id="input-min" min="0" max="99" value="3">
          <span><ruby>分<rt>ふん</rt></ruby></span>
        </div>
        <div class="input-wrapper">
          <input type="number" id="input-sec" min="0" max="59" value="0">
          <span><ruby>秒<rt>びょう</rt></ruby></span>
        </div>
      </div>
      
      <button id="add-btn" class="primary-btn">
        <span class="btn-text"><ruby>開始<rt>かいし</rt></ruby></span>
        <span class="spinner hidden"></span>
      </button>
    </div>

    <!-- エラー・成功通知用のToast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <footer class="footer">
    <small>© 2026 どこでも<ruby>時間<rt>じかん</rt></ruby>タイマー <a href="https://giga-school.com" target="_blank" rel="noopener noreferrer">GIGA山</a></small>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
